<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#091653"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="NG Studio"/>
  <meta name="application-name" content="NG Studio"/>
  <meta name="description" content="NG Studio — ordens de serviço, produção e financeiro da NG PrintSign"/>
  <title>NG Studio • Gestão da gráfica</title>
  <link rel="icon" href="assets/brand-symbol.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="assets/brand.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="stylesheet" href="assets/styles.css"/>
  <link rel="stylesheet" href="assets/theme.css"/>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('ngstudio_theme_v1')==='light'?'light':'dark';}catch{document.documentElement.dataset.theme='dark';}</script>
  <script src="config.js"></script>
  <script type="module" src="assets/app.js"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script>
</head>
<body>
  <div id="app"><div class="splash"><img class="splash-brand" src="assets/brand.svg" alt="NG PrintSign Gráfica"/><p>Preparando o NG Studio...</p></div></div>
  <div id="modal-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
</body>
</html>
